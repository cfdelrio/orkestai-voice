name: Deploy to EC2

on:
  push:
    branches:
      - main
      - claude/multi-tenant-phone-campaigns-tMD0m
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # Decode base64 key preserving exact format
          echo "$SSH_KEY" | base64 -d > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          ssh -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=60 \
            "$EC2_USER@$EC2_HOST" \
            "BRANCH='$BRANCH' bash -s" << 'SCRIPT'
          set -e

          cd /opt/orkestai-voice

          sudo -u orkestai git fetch origin
          sudo -u orkestai git checkout "$BRANCH"
          sudo -u orkestai git pull origin "$BRANCH"

          sudo -u orkestai npm ci

          sudo -u orkestai bash -c "cd /opt/orkestai-voice/ui && npm ci && npm run build"

          sudo -u orkestai pm2 startOrRestart /opt/orkestai-voice/ecosystem.config.js --env production
          sudo -u orkestai pm2 save

          echo "Deploy complete"
          SCRIPT

          rm -f /tmp/deploy_key
